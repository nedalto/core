version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      oxc:
        patterns: ["oxfmt", "oxlint", "oxlint-tsgolint"]
      matter:
        patterns: ["@matter/*"]
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
