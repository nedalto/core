name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
      - id: install
        run: npm ci
      - name: format
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run format:check
      - name: lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run lint
      - name: type
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run --workspaces type

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
      - run: npm ci
      - run: npm run --workspaces test

  hub:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
      - run: npm ci
      - run: npm run --workspace=@nedalto/hub build
      - run: npm pack --no-workspaces --pack-destination apps/hub/dist ./apps/hub/dist
      # Installed outside the repository, where the workspace's node_modules cannot supply what the manifest lacks.
      - run: npm install --global --prefix "$RUNNER_TEMP/host" apps/hub/dist/nedalto-hub-*.tgz
      - run: npm run --workspace=@nedalto/hub e2e
        env:
          E2E_HUB_BIN: ${{ runner.temp }}/host/bin/nedalto-hub
